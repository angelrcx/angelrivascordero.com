<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Rivas Cordero</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpg" href="images/logo.jpg">
</head>
<body>
    <header class="encabezado-logo">
        <div class="logo-contenedor">
            <img src="images/logo.gif" alt="logo" class="logo-gif">
            <a href="index.html" class="hitbox-ovalado" aria-label="Inicio"></a>
        </div>
    </header>

    <div class="video-wrapper">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/fondo2.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <!-- Usamos contenedor-maestro junto con feed-bloques -->
    <main class="contenedor-maestro feed-bloques">
        <a href="escritos/primero.html" class="bloque"><img src="images/escrito1.webp" alt="Galería"></a>
        
        <a href="https://www.youtube.com/watch?v=2p2DdY11mLk" target="_blank" class="bloque">
            <img src="images/mixtape1.webp" alt="Video YouTube">
        </a>
        
        <a href="https://etcetera.page/" class="bloque"><img src="images/logo_etc.webp" alt="Galería"></a>
        
        <div class="bloque js-abrir-modal" data-tipo="video" data-src="video/visual_sa.mp4" data-desc="visual para los segundo auxilios">
            <video src="video/visual_sa.mp4" autoplay muted loop playsinline></video>
        </div>

        <div class="bloque js-abrir-modal" data-tipo="imagen" data-src="images/toro_pra.webp" data-desc="quiero hacer una playera con esto">
            <img src="images/toro_pra.webp" alt="Foto con pie de página">
        </div>

        <a href="https://www.youtube.com/watch?v=Q9KhlSQF09U" target="_blank" class="bloque">
            <img src="images/just_kids.webp" alt="Video YouTube">
        </a>

        <div class="bloque js-abrir-modal" data-tipo="imagen" data-src="images/flyer_diles.webp" data-desc="flyer para picnic abriendo a los diles">
            <img src="images/flyer_diles.webp" alt="Foto con pie de página">
        </div>

        <div class="bloque js-abrir-modal" data-tipo="imagen" data-src="images/flyer_karla.webp" data-desc="flyer para karla">
            <img src="images/flyer_karla.webp" alt="Foto con pie de página">
        </div>

        <div class="bloque js-abrir-modal" data-tipo="imagen" data-src="images/milanesa.webp" data-desc="la mejor milanesa que he comido (cancinos)">
            <img src="images/milanesa.webp" alt="Foto con pie de página">
        </div> 

        <div class="bloque js-abrir-modal" data-tipo="imagen" data-src="images/picnic_cdmx.webp" data-desc="picnic cdmx julio 26">
            <img src="images/picnic_cdmx.webp" alt="Foto con pie de página">
        </div>
        
        <a href="fotos.html" class="bloque"><img src="images/aquel.jpeg" alt="Galería"></a>
        
        <div class="bloque js-abrir-modal" data-tipo="video" data-src="video/fondo2.mp4" data-desc="una llamada triste">
            <video src="video/fondo2.mp4" autoplay muted loop playsinline></video>
        </div>

        
    </main>

    <div id="modal-universal" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <div class="modal-caja">
            <div id="modal-media-contenedor"></div>
            <p id="modal-descripcion" class="modal-desc"></p>
        </div>
    </div>

    <div class="marquee-container">
        <div class="marquee-text">
            angel rivascordero aquel &nbsp;&nbsp;&nbsp; angel rivascordero aquel
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
