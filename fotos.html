<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos | Angel Rivas Cordero</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado-logo">
        <div class="logo-contenedor">
            <img src="images/logo.gif" alt="logo" class="logo-gif">
            <a href="index.html" class="hitbox-ovalado" aria-label="Inicio"></a>
        </div>
    </header>

    <!-- El suelo de cuadrícula interactivo -->
    <main id="galeria-dinamica" class="scatter-floor">
        <div id="floor-canvas" class="floor-canvas"></div>
    </main>

    <!-- Modal para ver en grande -->
    <div id="modal-universal" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <span class="nav-lightbox nav-prev">&lt;</span>
        <span class="nav-lightbox nav-next">&gt;</span>
        
        <div class="modal-caja">
            <div id="modal-media-contenedor"></div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
